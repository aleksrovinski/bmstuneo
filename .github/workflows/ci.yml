name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./bmstu_lks_flutter
        run: flutter pub get

      - name: Analyze code
        working-directory: ./bmstu_lks_flutter
        run: flutter analyze

      - name: Run unit & widget tests
        working-directory: ./bmstu_lks_flutter
        run: flutter test
