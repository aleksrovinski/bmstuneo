# Codemagic CI/CD configuration for BMSTU neo
# Documentation: https://docs.codemagic.io/yaml-quick-start/

workflows:
  ios-release:
    name: BMSTU neo iOS (TestFlight & App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - app_store_credentials # Environment group containing:
                                # APP_STORE_CONNECT_KEY_IDENTIFIER
                                # APP_STORE_CONNECT_ISSUER_ID
                                # APP_STORE_CONNECT_PRIVATE_KEY
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "ru.bmstu.neo"

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "ru.bmstu.neo" \
            --type IOS_APP_STORE \
            --create
          app-store-connect fetch-signing-files "ru.bmstu.neo.ScheduleWidget" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Run Flutter analyzer and unit tests
        script: |
          flutter analyze
          flutter test

      # Version and build number come from `version:` in pubspec.yaml (e.g. 1.3.0+9).
      # Bump the +N part before each upload: TestFlight rejects a build number it already has.
      - name: Build Flutter iOS release IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      # Automatically upload to TestFlight
      app_store_connect:
        auth: integration # Uses the App Store Connect API key configured in Codemagic
        submit_to_testflight: true
        expire_build_submitted_for_testing: false
